modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
WindowsX++ - Addon for WindowX.

Adds predicate support for command conditions and terminal-style console windows.
'''

[[mixins]]
config="windowxpp.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="windowx"
    type="required"
    versionRange="[${windowx_mod_version},)"
    ordering="NONE"
    side="BOTH"
