modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors='''XSY_xiaoqi'''
logoFile="icon.png"
description='''
WindowsX++ - Addon for WindowX.

Adds terminal-style console windows driven by commands and datapacks, with ANSI rendering, scoreboard criteria for the game window, and input and key events written back to the game.
'''

[[mixins]]
config="windowxpp.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="windowx"
    type="required"
    versionRange="[${windowx_mod_version},)"
    ordering="NONE"
    side="BOTH"
